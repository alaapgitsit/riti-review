<style>
/* Layout: a pannable board. Each user flow is a lane of phone frames joined by labelled arrows;
   a sticky toolbar switches language, age mode, zoom and frame length. Brand colours from theme v2. */
:root {

  --dot: #CDD0E0;          /* board dot grid */
  --panel: #FFFFFF;
  --ink: #111844;
  --ink-soft: #4A5079;
  --line: #C9CCDD;
  --pink: #FF414E;
  --yellow: #FFDE22;
  --on-yellow: #111844;
  --arrow: #111844;
  --ok: #1E7A45; --ok-bg: #E3F4EA; --fix-bg: #FFE6E8;
  --shadow: 0 1px 2px rgba(17,24,68,.08), 0 8px 24px rgba(17,24,68,.10);
  --f-display: "Plus Jakarta Sans", "Mukta", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", "Mukta", system-ui, sans-serif;
  --f-deva: "Mukta", "Plus Jakarta Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --board: #0B0F2E; --dot: #1C2350; --panel: #161C45; --ink: #EEF0FA; --ink-soft: #A3A8C8; --line: #2A3166;
  --arrow: #EEF0FA; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
  --ok: #3FBF73; --ok-bg: #123A27; --fix-bg: #4A1820;
} }
:root[data-theme="dark"] {
  --board: #0B0F2E; --dot: #1C2350; --panel: #161C45; --ink: #EEF0FA; --ink-soft: #A3A8C8; --line: #2A3166;
  --arrow: #EEF0FA; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
  --ok: #3FBF73; --ok-bg: #123A27; --fix-bg: #4A1820;
}
html, body { height: 100%; }
body { background: var(--board); color: var(--ink); font: 14px/1.45 var(--f-body); display: flex; flex-direction: column; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }

/* Toolbar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font: 800 18px/1.1 var(--f-display); margin: 0; letter-spacing: -.01em; }
.brand h1 i { font-style: normal; color: var(--pink); }
.meta { font: 12px var(--f-mono); color: var(--ink-soft); }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl > span { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--board); }
.seg button { border: 0; background: transparent; color: var(--ink); font: 600 13px var(--f-body); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--yellow); color: var(--on-yellow); }
.seg button:focus-visible, .lanes a:focus-visible, .frame:focus-visible, .lb button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.seg .deva { font-family: var(--f-deva); font-size: 14px; }
.zoomval { font: 500 12px var(--f-mono); min-width: 3.5em; text-align: center; font-variant-numeric: tabular-nums; }
.lanes { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.lanes a { flex: none; font: 600 12px var(--f-body); color: var(--ink); text-decoration: none; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.lanes a:hover { border-color: var(--ink); }

/* Board */
.board { flex: 1; overflow: auto; cursor: grab; background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px; }
.board.drag { cursor: grabbing; user-select: none; }
.canvas { padding: 32px 40px 80px; display: flex; flex-direction: column; gap: 56px; width: max-content; }
.lane-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; max-width: 900px; margin-bottom: 14px; }
.lane-head h2 { font: 800 26px/1.1 var(--f-display); margin: 0; letter-spacing: -.015em; }
.lane-head .n { font: 500 13px var(--f-mono); color: var(--pink); }
.lane-head p { flex-basis: 100%; margin: 0; color: var(--ink-soft); font-size: 15px; max-width: 70ch; }
.tag { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; background: var(--yellow); color: var(--on-yellow); padding: 3px 8px; border-radius: 6px; }
.track { display: flex; align-items: flex-start; }
.step { display: flex; flex-direction: column; gap: 8px; }
.cap { display: flex; align-items: baseline; gap: 8px; }
.cap b { font: 700 15px var(--f-display); }
.cap .idx { font: 500 12px var(--f-mono); color: var(--ink-soft); }
.cap code { font: 12px var(--f-mono); color: var(--ink-soft); margin-left: auto; }
.pair { display: flex; gap: 12px; }
.frame { position: relative; display: block; padding: 0; border: 0; background: var(--panel); border-radius: 26px; box-shadow: var(--shadow); overflow: hidden; cursor: zoom-in; width: 300px; }
.frame img { display: block; width: 100%; height: auto; }
.short .frame img { aspect-ratio: 390 / 844; object-fit: cover; object-position: top; }
.frame .lang { position: absolute; bottom: 10px; left: 10px; font: 600 11px var(--f-body); background: var(--ink); color: var(--board); padding: 2px 8px; border-radius: 999px; }
.frame .missing { width: 100%; aspect-ratio: 390/844; display: grid; place-items: center; color: var(--ink-soft); font-size: 13px; padding: 20px; text-align: center; }
.edge { width: 150px; flex: none; align-self: stretch; display: flex; flex-direction: column; justify-content: flex-start; padding-top: 180px; gap: 6px; align-items: center; }
.edge svg { width: 100%; height: 18px; overflow: visible; }
.edge .lbl { font: 600 13px var(--f-body); text-align: center; padding: 0 10px; line-height: 1.3; }
.edge .lbl .hi { display: block; font-family: var(--f-deva); font-weight: 600; color: var(--ink-soft); }
.edge .from { font: 12px var(--f-mono); color: var(--pink); text-align: center; }
.edge.branch .shaft { stroke-dasharray: 5 5; }

/* Lightbox */
.lb { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--board) 92%, transparent); display: flex; flex-direction: column; backdrop-filter: blur(4px); }
.lb[hidden] { display: none !important; }
.lb header { display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.lb header b { font: 700 16px var(--f-display); }
.lb header span { color: var(--ink-soft); font: 12px var(--f-mono); }
.lb header .sp { margin-left: auto; }
.lb button.ic { border: 1px solid var(--line); background: var(--panel); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font: 600 16px var(--f-body); }
.lb .body { flex: 1; overflow: auto; display: flex; justify-content: center; gap: 24px; padding: 24px 16px; }
.lb .body figure { margin: 0; display: flex; flex-direction: column; gap: 8px; align-items: center; min-width: 0; }
.lb .body figcaption { font: 600 12px var(--f-body); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .07em; }
.lb .body img { width: min(390px, 86vw); border-radius: 24px; box-shadow: var(--shadow); }
.foot { font-size: 12px; color: var(--ink-soft); max-width: 80ch; }
@media (max-width: 640px) { .ctl > span { display: none; } .canvas { padding: 20px 16px 60px; } .brand .meta { display: none; } }
@media (prefers-reduced-motion: no-preference) { .frame { transition: transform .15s ease; } .frame:hover { transform: translateY(-2px); } }

/* Review: a reviewer ticks each screen (approve / needs change, with a note); saved per reviewer in the
   artifact's database (reviews/<reviewer id>). The Reviews panel counts screens per reviewer for payment. */
.cell { display: flex; flex-direction: column; gap: 8px; width: 300px; }
.cell.ok .frame { box-shadow: 0 0 0 3px var(--ok), var(--shadow); }
.cell.fix .frame { box-shadow: 0 0 0 3px var(--pink), var(--shadow); }
.cell.done-hidden { display: none; }
.rv { display: none; flex-wrap: wrap; gap: 6px; align-items: center; }
body.reviewing .rv { display: flex; }
.rv button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 600 12.5px var(--f-body); padding: 6px 11px; border-radius: 999px; cursor: pointer; }
.rv button.ok[aria-pressed="true"] { background: var(--ok-bg); border-color: var(--ok); }
.rv button.fix[aria-pressed="true"] { background: var(--fix-bg); border-color: var(--pink); }
.rv button:disabled { opacity: .55; cursor: not-allowed; }
.rv textarea { flex-basis: 100%; min-height: 54px; font: 13px/1.4 var(--f-body); border: 1px solid var(--line); border-radius: 12px; padding: 7px 9px; background: var(--panel); color: var(--ink); resize: vertical; }
.rv .who { font: 500 11.5px var(--f-mono); color: var(--ink-soft); }
#rvbar[hidden] { display: none !important; }
#rvmsg { font: 12px var(--f-body); color: var(--ink-soft); }
.rp { position: fixed; inset: 0; z-index: 25; background: color-mix(in srgb, var(--board) 94%, transparent); display: flex; flex-direction: column; backdrop-filter: blur(4px); }
.rp[hidden] { display: none !important; }
.rp header { display: flex; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.rp header b { font: 700 16px var(--f-display); }
.rp header .sp { margin-left: auto; }
.rp .body { flex: 1; overflow: auto; padding: 20px 16px 40px; max-width: 900px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.rp .sum { font-size: 15px; margin: 0 0 16px; }
.rp table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.rp th, .rp td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
.rp th { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); }
.rp td.n, .rp th.n { text-align: right; font-variant-numeric: tabular-nums; }
.rp .act { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.pill { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 600 13px var(--f-body); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--yellow); color: var(--on-yellow); border-color: var(--yellow); }
.rp .note { color: var(--ink-soft); font-size: 13px; margin-top: 14px; max-width: 70ch; }
@media (max-width: 640px) { .rp th, .rp td { padding: 8px; font-size: 13px; }
  .bar { gap: 6px; padding-block: 8px; } .bar .row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 8px; } .bar .row::-webkit-scrollbar { display: none; }
  .brand { flex: none; } .ctl, .pill { flex: none; } #rvmsg { white-space: nowrap; } }
</style>

const API = "https://sxovqabtbpzwtwsesdjn.supabase.co/functions/v1/screen-review";
const $ = (s) => document.querySelector(s);
const store = { get(k, d) { try { return localStorage.getItem('flowmap.' + k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem('flowmap.' + k, v); } catch {} } };
const S = { lang: store.get('lang', 'en'), mode: store.get('mode', 'adult'), len: store.get('len', 'short'), zoom: +store.get('zoom', '0') || 0 };
const MODE_NAME = { adult: 'Adult', kid: 'Kid', elder: 'Elder' };

$('#meta').textContent = `${M.flows.reduce((n, f) => n + f.steps.reduce((m, s) => m + Object.keys(s.shots).length, 0), 0)} screens · ${M.flows.reduce((n, f) => n + f.steps.length, 0)} steps · ${M.flows.length} flows · built ${new Date(M.generated).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}${M.commit ? ' · ' + M.commit : ''}`;

function seg(id, key) {
  const el = $('#' + id);
  const sync = () => el.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S[key])));
  el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S[key] = b.dataset.v; store.set(key, S[key]); sync(); render(); });
  sync();
}
seg('lang', 'lang'); seg('mode', 'mode'); seg('len', 'len');

const shot = (step, flow, lang) => step.shots[`${lang}-${flow.sameInAllModes ? 'adult' : S.mode}`];
const langs = () => (S.lang === 'both' ? ['en', 'hi'] : [S.lang]);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function edgeHTML(step, flow) {
  const e = step.edge || { en: '', hi: '' };
  const from = step.from ? flow.steps.find((s) => s.id === step.from) : null;
  const lbl = S.lang === 'both' ? `${esc(e.en)}<span class="hi">${esc(e.hi)}</span>` : S.lang === 'hi' ? `<span class="hi" style="color:var(--ink)">${esc(e.hi)}</span>` : esc(e.en);
  return `<div class="edge${from ? ' branch' : ''}" aria-hidden="true">
    ${from ? `<div class="from">from ${esc(from.name)}</div>` : ''}
    <svg viewBox="0 0 150 18" preserveAspectRatio="none"><line class="shaft" x1="6" y1="9" x2="138" y2="9" stroke="var(--arrow)" stroke-width="2"/><path d="M136 3 L146 9 L136 15 Z" fill="var(--arrow)"/></svg>
    <div class="lbl">${lbl}</div></div>`;
}

function render() {
  document.body.classList.toggle('short', S.len === 'short');
  $('#lanes').innerHTML = M.flows.map((f, i) => `<a href="#${f.id}">${i + 1} · ${esc(f.title)}</a>`).join('');
  $('#canvas').innerHTML = M.flows.map((f, fi) => `
    <section class="lane" id="${f.id}" aria-labelledby="h-${f.id}">
      <div class="lane-head"><span class="n">${String(fi + 1).padStart(2, '0')}</span><h2 id="h-${f.id}">${esc(f.title)}</h2>
        ${f.sameInAllModes && S.mode !== 'adult' ? `<span class="tag">Same in every mode</span>` : ''}<p>${esc(f.about)}</p></div>
      <div class="track">${f.steps.map((s, si) => `${si ? edgeHTML(s, f) : ''}
        <div class="step"><div class="cap"><span class="idx">${si + 1}</span><b>${esc(s.name)}</b>${s.route && s.route !== '/' ? `<code>${esc(s.route)}</code>` : ''}</div>
          <div class="pair">${langs().map((l) => { const sh = shot(s, f, l); const k = keyOf(f, s, l); return `<div class="${cellClass(k, sh)}" data-k="${esc(k)}"><button class="frame" data-f="${fi}" data-s="${si}" aria-label="${esc(s.name)}, ${l === 'hi' ? 'Hindi' : 'English'}, open larger">
            ${S.lang === 'both' ? `<span class="lang">${l === 'hi' ? 'हिन्दी' : 'EN'}</span>` : ''}
            ${sh ? `<img src="${sh.file}" alt="${esc(s.name)} screen, ${l === 'hi' ? 'Hindi' : 'English'}, ${MODE_NAME[S.mode]} mode" loading="lazy" decoding="async">` : `<div class="missing">Not captured: re-run the flow map</div>`}
          </button>${sh ? rvHTML(k) : ''}</div>`; }).join('')}</div></div>`).join('')}</div>
    </section>`).join('') + `<p class="foot">Screens are captured automatically from the latest app build (the same one as the preview), with a sample family loaded. To refresh after changes: <code>npm run preview:build && npm run flowmap</code>.</p>`;
  applyZoom();
}

// Zoom: CSS zoom on the canvas keeps native scrolling for panning.
const board = $('#board'), canvas = $('#canvas');
function fitZoom() { const w = board.clientWidth; return Math.max(.2, Math.min(1, w / (w < 700 ? 420 : 1500))); }
function applyZoom() { if (!S.zoom) S.zoom = fitZoom(); canvas.style.zoom = S.zoom; $('#zval').textContent = Math.round(S.zoom * 100) + '%'; }
const setZoom = (z) => { S.zoom = Math.max(.2, Math.min(2, Math.round(z * 20) / 20)); store.set('zoom', S.zoom); applyZoom(); };
$('#zin').onclick = () => setZoom(S.zoom + .1); $('#zout').onclick = () => setZoom(S.zoom - .1); $('#zfit').onclick = () => setZoom(fitZoom());
board.addEventListener('wheel', (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(S.zoom * (e.deltaY < 0 ? 1.1 : 0.9)); } }, { passive: false });

// Drag to pan (mouse); touch uses native scrolling.
let drag = null;
board.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('.frame')) return; drag = { x: e.clientX, y: e.clientY, l: board.scrollLeft, t: board.scrollTop }; board.classList.add('drag'); });
addEventListener('pointermove', (e) => { if (!drag) return; board.scrollLeft = drag.l - (e.clientX - drag.x); board.scrollTop = drag.t - (e.clientY - drag.y); });
addEventListener('pointerup', () => { drag = null; board.classList.remove('drag'); });

// Lane links scroll inside the board.
$('#lanes').addEventListener('click', (e) => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); jump(a.getAttribute('href').slice(1)); });
function jump(id) { const el = document.getElementById(id); if (!el) return; board.scrollTo({ top: el.offsetTop * S.zoom - 12, left: 0, behavior: 'smooth' }); }

// Lightbox
let cur = null;
canvas.addEventListener('click', (e) => { if (e.target.closest('.rv')) return; const b = e.target.closest('.frame'); if (b) openLB(+b.dataset.f, +b.dataset.s); });
function openLB(f, s) {
  cur = { f, s }; const flow = M.flows[f], step = flow.steps[s];
  $('#lbt').textContent = `${flow.title} · ${s + 1}. ${step.name}`;
  $('#lbr').textContent = `${step.route || ''} · ${MODE_NAME[flow.sameInAllModes ? 'adult' : S.mode]}`;
  $('#lbb').innerHTML = langs().map((l) => { const sh = shot(step, flow, l); const k = keyOf(flow, step, l); return `<figure class="${cellClass(k, sh)}" data-k="${esc(k)}" style="width:auto"><figcaption>${l === 'hi' ? 'हिन्दी' : 'English'}</figcaption>${sh ? `<img src="${sh.file}" alt="${esc(step.name)}, ${l === 'hi' ? 'Hindi' : 'English'}">${rvHTML(k)}` : '<p>Not captured</p>'}</figure>`; }).join('');
  $('#lbprev').disabled = s === 0; $('#lbnext').disabled = s === flow.steps.length - 1;
  $('#lb').hidden = false; $('#lbx').focus();
}
const closeLB = () => { $('#lb').hidden = true; cur = null; };
$('#lbx').onclick = closeLB;
$('#lbprev').onclick = () => cur && cur.s > 0 && openLB(cur.f, cur.s - 1);
$('#lbnext').onclick = () => cur && cur.s < M.flows[cur.f].steps.length - 1 && openLB(cur.f, cur.s + 1);
addEventListener('keydown', (e) => { if (!cur) return; if (e.key === 'Escape') closeLB(); if (e.key === 'ArrowLeft') $('#lbprev').click(); if (e.key === 'ArrowRight') $('#lbnext').click(); });


// ── Review: approve each screen, note what needs changing, count per reviewer ────────────────────
// Stored in the artifact's database, one document per reviewer: reviews/<reviewer id> =
// { screens: { "<flow>~<step>~<lang>-<mode>": { s: "ok" | "fix", n: note, at: ISO date, b: build } }, updated }.
// Only ids are stored, never names. Reviewers see their own; the owner and editors see everyone's.
const R = { ready: false, db: null, user: null, uid: null, admin: false, canWrite: false, mine: {}, all: {}, saving: false, dirty: false, timer: 0, pending: new Set(), token: null, name: '',
  on: store.get('review', '1') === '1', hide: store.get('hideReviewed', '0') === '1' };
const keyOf = (f, s, l) => `${f.id}~${s.id}~${l}-${f.sameInAllModes ? 'adult' : S.mode}`;
const ALL = []; M.flows.forEach((f) => f.steps.forEach((s) => Object.keys(s.shots).forEach((lm) => ALL.push({ key: `${f.id}~${s.id}~${lm}`, flow: f.title, step: s.name, lang: lm.split('-')[0], mode: lm.split('-')[1] }))));
const INFO = Object.fromEntries(ALL.map((a) => [a.key, a]));
function cellClass(k, sh) {
  const m = R.ready ? R.mine[k] : null;
  return ['cell', m && m.s === 'ok' ? 'ok' : '', m && m.s === 'fix' ? 'fix' : '', R.ready && R.hide && m && m.s ? 'done-hidden' : ''].join(' ').trim();
}
function tally(k) { let ok = 0, fix = 0; for (const id in R.all) { const v = R.all[id][k]; if (v && v.s === 'ok') ok++; else if (v && v.s === 'fix') fix++; } return { ok, fix }; }
function rvHTML(k) {
  if (!R.ready) return '';
  const m = R.mine[k] || {}, dis = R.canWrite ? '' : ' disabled';
  const t = R.admin ? tally(k) : null;
  return `<div class="rv" data-k="${esc(k)}"><button class="ok" data-a="ok" aria-pressed="${m.s === 'ok'}"${dis}>✓ Approve</button><button class="fix" data-a="fix" aria-pressed="${m.s === 'fix'}"${dis}>Needs change</button>`
    + (t && (t.ok || t.fix) ? `<span class="who">All reviewers: ✓ ${t.ok}${t.fix ? ' · needs change ' + t.fix : ''}</span>` : '')
    + (m.s === 'fix' || m.n ? `<textarea data-k="${esc(k)}" aria-label="What should change on this screen?" placeholder="What should change?"${dis}>${esc(m.n || '')}</textarea>` : '') + '</div>';
}
function refreshKey(k) {
  document.querySelectorAll(`[data-k="${CSS.escape(k)}"].cell, figure[data-k="${CSS.escape(k)}"]`).forEach((c) => { c.className = cellClass(k, true); const rv = c.querySelector('.rv'); if (rv) rv.outerHTML = rvHTML(k); });
}
const setMsg = (t) => { $('#rvmsg').textContent = t; };
function queueSave() { clearTimeout(R.timer); R.timer = setTimeout(save, 500); setMsg('Saving…'); }
async function save() {
  if (R.saving) { R.dirty = true; return; }
  R.saving = true;
  try {
    if (API) {
      const keys = [...R.pending]; R.pending.clear();
      for (const k of keys) {
        const v = R.mine[k] || {};
        const res = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ r: R.token, key: k, s: v.s || null, n: v.n || '', b: M.commit || '' }) });
        if (!res.ok) { keys.forEach((x) => R.pending.add(x)); throw { code: res.status === 404 ? 'unknown_link' : 'unavailable' }; }
      }
    } else await R.db.doc('reviews/' + R.uid).set({ screens: R.mine, updated: new Date().toISOString() });
    setMsg(`Saved · you have reviewed ${countMine().reviewed} of ${ALL.length} screens`); }
  catch (e) {
    if (e && e.code === 'unknown_link') { R.canWrite = false; setMsg('This review link is no longer active. Ask Riti for a new one.'); render(); }
    else if (e && e.code === 'invalid_argument') { R.canWrite = false; setMsg('You can look but not review here. Ask the owner for Contributor access.'); render(); }
    else setMsg('Not saved. Check your connection and try again.');
  }
  R.saving = false;
  if (R.dirty) { R.dirty = false; save(); }
}
function countOf(screens) { let ok = 0, fix = 0, last = ''; for (const k in screens) { const v = screens[k]; if (!INFO[k] || !v) continue; if (v.s === 'ok') ok++; else if (v.s === 'fix') fix++; if (v.at > last) last = v.at; } return { ok, fix, reviewed: ok + fix, last }; }
const countMine = () => countOf(R.mine);
function onReviewClick(e) {
  const b = e.target.closest('.rv button'); if (!b || !R.canWrite) return;
  e.stopPropagation();
  const k = b.closest('.rv').dataset.k, a = b.dataset.a, cur = R.mine[k] || {};
  // Pressing the chosen button again takes the tick back (a note, if any, is kept).
  if (cur.s === a) { const { s: _, ...rest } = cur; if (rest.n) R.mine[k] = { ...rest, at: new Date().toISOString() }; else delete R.mine[k]; }
  else R.mine[k] = { ...cur, s: a, at: new Date().toISOString(), b: M.commit || '' };
  R.pending.add(k); refreshKey(k); queueSave();
}
function onReviewInput(e) {
  const t = e.target.closest('.rv textarea'); if (!t || !R.canWrite) return;
  const k = t.dataset.k, cur = R.mine[k] || { s: 'fix' };
  R.mine[k] = { ...cur, n: t.value.slice(0, 2000), at: new Date().toISOString(), b: M.commit || '' };
  R.pending.add(k); queueSave();
}
canvas.addEventListener('click', onReviewClick, true); $('#lbb').addEventListener('click', onReviewClick, true);
canvas.addEventListener('input', onReviewInput); $('#lbb').addEventListener('input', onReviewInput);

function pillSync() { $('#rvon').setAttribute('aria-pressed', String(R.on)); $('#rvhide').setAttribute('aria-pressed', String(R.hide)); document.body.classList.toggle('reviewing', R.on); }
$('#rvon').onclick = () => { R.on = !R.on; store.set('review', R.on ? '1' : '0'); pillSync(); };
$('#rvhide').onclick = () => { R.hide = !R.hide; store.set('hideReviewed', R.hide ? '1' : '0'); pillSync(); render(); };

// Reviews panel: per-reviewer counts for payment, and a CSV of every tick and note.
async function openPanel() {
  const ids = Object.keys(R.all); if (!ids.includes(R.uid) && Object.keys(R.mine).length) ids.push(R.uid);
  let names = {}; if (API) names = { [R.uid]: { name: R.name } }; else try { names = await R.user.profiles(ids); } catch {}
  const rows = ids.map((id) => ({ id, name: (names[id] && names[id].name) || (id === R.uid ? 'You' : 'Someone'), c: countOf(id === R.uid ? R.mine : R.all[id]) })).sort((a, b) => b.c.reviewed - a.c.reviewed);
  let anyOk = 0, anyFix = 0; for (const a of ALL) { const t = tally(a.key); if (t.ok) anyOk++; else if (t.fix) anyFix++; }
  const day = (d) => d ? new Date(d).toLocaleDateString([], { dateStyle: 'medium' }) : '—';
  const body = $('#rpb'); body.textContent = '';
  const sum = document.createElement('p'); sum.className = 'sum';
  sum.textContent = R.admin ? `${anyOk} of ${ALL.length} screens approved by at least one reviewer · ${anyFix} need changes · ${ALL.length - anyOk - anyFix} not reviewed yet.` : `You have reviewed ${countMine().reviewed} of ${ALL.length} screens.`;
  body.append(sum);
  const tbl = document.createElement('table');
  tbl.innerHTML = '<thead><tr><th>Reviewer</th><th class="n">Screens reviewed</th><th class="n">Approved</th><th class="n">Needs change</th><th>Last active</th></tr></thead><tbody></tbody>';
  for (const r of rows) { const tr = document.createElement('tr'); [r.name, r.c.reviewed, r.c.ok, r.c.fix, day(r.c.last)].forEach((v, i) => { const td = document.createElement('td'); if (i && i < 4) td.className = 'n'; td.textContent = String(v); tr.append(td); }); tbl.tBodies[0].append(tr); }
  if (!rows.length) { const tr = document.createElement('tr'); const td = document.createElement('td'); td.colSpan = 5; td.textContent = 'No reviews yet.'; tr.append(td); tbl.tBodies[0].append(tr); }
  body.append(tbl);
  const act = document.createElement('div'); act.className = 'act';
  const dl = document.createElement('button'); dl.className = 'pill'; dl.textContent = 'Download all ticks and notes (CSV)';
  dl.onclick = () => downloadCSV(rows); act.append(dl); body.append(act);
  const note = document.createElement('p'); note.className = 'note';
  note.textContent = 'A screen counts once per reviewer, whether approved or marked "needs change". Each tick records the build it was given on. ' + (R.admin ? '' : 'Only the owner sees everyone’s reviews.');
  body.append(note);
  $('#rp').hidden = false; $('#rpx').focus();
}
const cell = (v) => { let t = String(v ?? ''); if (/^[=+\-@]/.test(t)) t = "'" + t; return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
async function downloadCSV(rows) {
  const lines = [['Reviewer', 'Flow', 'Screen', 'Language', 'Mode', 'Status', 'Note', 'Date', 'Build', 'Screen key'].join(',')];
  for (const r of rows) { const screens = r.id === R.uid ? R.mine : R.all[r.id]; for (const k in screens) { const v = screens[k], i = INFO[k]; if (!i || !v) continue; lines.push([r.name, i.flow, i.step, i.lang === 'hi' ? 'Hindi' : 'English', MODE_NAME[i.mode] || i.mode, v.s === 'ok' ? 'Approved' : v.s === 'fix' ? 'Needs change' : '', v.n || '', v.at ? v.at.slice(0, 10) : '', v.b || '', k].map(cell).join(',')); } }
  const filename = `riti-screen-review-${new Date().toISOString().slice(0, 10)}.csv`;
  if (API) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })); a.download = filename; document.body.append(a); a.click(); a.remove(); return; }
  try { const dlc = await claude.use('downloads'); if (!dlc) { setMsg('Downloads are not available here.'); return; } await dlc.save({ filename, data: lines.join('\n') }); }
  catch (e) { setMsg('The download did not complete.'); }
}
$('#rvopen').onclick = openPanel;
$('#rpx').onclick = () => { $('#rp').hidden = true; };
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#rp').hidden) $('#rp').hidden = true; });

async function apiInit() {
  $('#rvbar').hidden = false;
  document.title = 'Riti screen review'; const h1 = $('.brand h1'); if (h1 && h1.lastChild) h1.lastChild.textContent = ' screen review';
  const t = new URLSearchParams(location.search).get('r');
  if (!t) { $('#rvon').hidden = $('#rvhide').hidden = $('#rvopen').hidden = true; setMsg('To tick screens, open the personal review link you were sent.'); return; }
  try {
    const res = await fetch(API + '?r=' + encodeURIComponent(t));
    if (res.status === 404) { $('#rvon').hidden = $('#rvhide').hidden = $('#rvopen').hidden = true; setMsg('This review link is not active. Ask Riti for a new one.'); return; }
    if (!res.ok) throw new Error();
    const d = await res.json();
    Object.assign(R, { token: t, uid: 'me', name: d.name || 'You', mine: d.ticks || {}, canWrite: true, admin: false, ready: true });
    R.all = { me: R.mine };
    pillSync(); render(); setMsg(`Welcome, ${R.name}. You have reviewed ${countMine().reviewed} of ${ALL.length} screens.`);
  } catch { setMsg('Your reviews could not load. Check your connection and reload the page.'); }
}
(async () => {
  if (API) return apiInit();
  if (!window.claude || !window.claude.use) return;
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!db || !user) return;
  const uid = await user.id();
  $('#rvbar').hidden = false;
  if (!uid) { $('#rvon').hidden = $('#rvhide').hidden = $('#rvopen').hidden = true; setMsg('Sign in to claude.ai to review screens.'); return; }
  Object.assign(R, { db, user, uid });
  R.admin = !!(await user.canEdit());
  const cw = await user.can('data.write'); R.canWrite = cw !== false;
  if (!R.canWrite) setMsg('You can look but not review here. Ask the owner for Contributor access.');
  const giveUp = setTimeout(() => { if (!R.ready) setMsg('Reviews could not load. Reload the page to try again.'); }, 10000);
  db.collection('reviews').onSnapshot((snap) => {
    clearTimeout(giveUp);
    const all = {}; snap.docs.forEach((d) => { const v = d.data(); if (v && v.screens) all[d.id] = v.screens; });
    if (!R.ready) { R.mine = JSON.parse(JSON.stringify(all[uid] || {})); R.ready = true; R.all = all; pillSync(); render(); if (R.canWrite) setMsg(`You have reviewed ${countMine().reviewed} of ${ALL.length} screens`); }
    else { all[uid] = R.mine; R.all = all; }
  }, () => { clearTimeout(giveUp); setMsg('Reviews could not load. Reload the page to try again.'); });
})();

render();
if (location.hash) setTimeout(() => jump(location.hash.slice(1)), 50);
</script>
